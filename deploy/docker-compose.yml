# Продакшен-стек Baikal: бэкенд + nginx. БД внешняя (подключение по ссылке),
# здесь её нет — только приложение и веб-сервер.
#
# Использование (из каталога deploy/):
#   cp .env.prod.example .env.prod   # заполнить секреты
#   docker compose up -d --build
#
# Перед этим (один раз):
#   - применить схему/роли/RLS к внешней БД (db/*.sql) через app_owner;
#   - собрать фронтенд: npm ci && npm run build (в ../frontend);
#   - положить сертификаты по путям из CERT_* переменных ниже.

services:
  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: baikal-backend
    restart: unless-stopped
    env_file:
      - .env.prod
    # JWT-ключи (RS256) монтируются, а не зашиваются в образ.
    volumes:
      - ../certs:/app/certs:ro
    networks:
      - deploy-net

  nginx:
    image: nginx:stable-alpine
    container_name: baikal-nginx
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Собранный фронтенд (frontend/dist) и сертификаты монтируются с хоста.
      - ../frontend/dist:/usr/share/nginx/html:ro
      - ${CERT_DIR}:/etc/nginx/certs:ro
    networks:
      - deploy-net

networks:
  deploy-net:
    driver: bridge
