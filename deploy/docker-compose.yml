# Продакшен-стек Baikal: бэкенд + nginx. БД внешняя (подключение по ссылке),
# здесь её нет — только приложение и веб-сервер.
#
# Использование (из каталога deploy/):
#   make setup       # .env из шаблона + JWT-ключи + сборка фронтенда
#   nano .env        # заполнить секреты (DSN внешней БД, LLM, CERT_DIR)
#   make up          # docker compose up -d --build
#
# Единый файл деплоя — deploy/.env: читается compose для подстановки ${...}
# (CERT_DIR) и передаётся в контейнер backend через env_file.
#
# Перед запуском (один раз):
#   - применить схему/роли/RLS к внешней БД (db/*.sql) через app_owner
#     (make db-init, если есть DATABASE_URL_OWNER в .env);
#   - собрать фронтенд: make frontend (в ../frontend/dist);
#   - положить TLS-сертификаты fullchain.pem/privkey.pem в каталог CERT_DIR.

services:
  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: baikal-backend
    restart: unless-stopped
    env_file:
      - .env
    # JWT-ключи (RS256) монтируются, а не зашиваются в образ.
    volumes:
      - ../certs:/app/certs:ro
    networks:
      - deploy-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:stable-alpine
    container_name: baikal-nginx
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Собранный фронтенд (frontend/dist) и сертификаты монтируются с хоста.
      # CERT_DIR обязателен: при отсутствии compose упадёт с понятной ошибкой.
      - ../frontend/dist:/usr/share/nginx/html:ro
      - ${CERT_DIR:?CERT_DIR must be set in deploy/.env}:/etc/nginx/certs:ro
    networks:
      - deploy-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  deploy-net:
    driver: bridge