# Nginx для Baikal: раздаёт статику фронтенда (SPA) и проксирует /api на бэкенд.
# Монтируется в /etc/nginx/conf.d/default.conf (см. docker-compose.yml).

# HTTP → HTTPS redirect.
server {
    listen 80;
    server_name _;

    # Отдаём по HTTPS.
    return 301 https://$host$request_uri;
}

# HTTPS: статика SPA + прокси API.
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # Сертификаты монтируются volume'ом (в compose).
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Заголовки безопасности.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Вопросы к LLM небольшие; поднимем лимит тела запроса.
    client_max_body_size 1m;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback на index.html для client-side routing (/chat, /login).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API проксируется на бэкенд-контейнер.
    # X-Forwarded-For нужен для rate limiting гостей по IP (ADR 37).
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # NDJSON-поток /api/v1/ask — не буферизовать.
        proxy_buffering off;
        proxy_read_timeout 120s;
    }
}
