[project]
name = "app"
version = "0.1.0"
description = "FastAPI приложение: text-to-SQL поверх db_mcp"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "langchain>=1.3.16",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "PyJWT>=2.9.0",
    "bcrypt>=4.2.0",
    "python-dotenv>=1.0.1",
]

[build-system]
requires = ["uv_build>=0.11.24,<0.12.0"]
build-backend = "uv_build"

[tool.uv]
package = true

[project.scripts]
app = "app.main:main"

[dependency-groups]
dev = [
    "httpx>=0.27.0",
]
