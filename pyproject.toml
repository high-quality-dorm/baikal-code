[project]
name = "app"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "sanbob", email = "saintsanbob@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.31.0",
    "langchain>=1.3.16",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
]

[project.scripts]
app = "app:main"

[build-system]
requires = ["uv_build>=0.11.24,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mkinit>=1.2.0",
    "ruff>=0.16.4",
    "ty>=0.0.74",
]
