[project]
name = "baikal"
version = "0.1.0"
description = "Безопасный text-to-SQL сервис для университетской базы данных"
readme = "README.md"
requires-python = ">=3.12"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/db_mcp", "packages/app"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.16.4",
    "ty>=0.0.74",
]
